{% extends "base.html" %}

{% block title %}部活動の削除｜練習試合調整支援システム{% endblock %}

{% block content %}

<div class="page-title">
    <h2>部活動の削除</h2>
</div>

<div class="form-container">
    <p>「{{ object.get_gender_display }}{{ object.sport.name }}部」を削除します。よろしいですか？</p>

    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn--danger">削除する</button>
        <a href="{% url 'my_club_list' %}" class="btn btn--secondary">キャンセル</a>
    </form>
</div>

{% endblock %}
