{% extends "base.html" %}

{% block title %}競技管理｜練習試合調整支援システム{% endblock %}

{% block content %}

<div class="page-title">
    <h2>競技管理</h2>
    <p>登録する競技の種類を管理します</p>
</div>

<div class="card">
    <div class="list-header">
        <a href="{% url 'sport_add' %}" class="btn">競技を追加</a>
    </div>

    <table>
        <thead>
            <tr>
                <th>競技名</th>
                <th>操作</th>
            </tr>
        </thead>
        <tbody>
            {% for sport in sports %}
                <tr>
                    <td>{{ sport.name }}</td>
                    <td>
                        <a href="{% url 'sport_edit' sport.pk %}" class="btn">編集</a>
                        <a href="{% url 'sport_delete' sport.pk %}" class="btn btn--danger">削除</a>
                    </td>
                </tr>
            {% empty %}
                <tr>
                    <td colspan="2">まだ競技が登録されていません。</td>
                </tr>
            {% endfor %}
        </tbody>
    </table>
</div>

<div class="back-login">
    <a href="{% url 'board_home' %}">← 管理メニューに戻る</a>
</div>

{% endblock %}
