{% extends "base.html" %}

{% block title %}競技の登録｜練習試合調整支援システム{% endblock %}

{% block heading %}競技管理{% endblock %}

{% block content %}

<div class="account-form-heading">
    <h2>新しい競技の登録</h2>
    <p>システムで使用する競技の情報を入力してください。</p>
</div>

<div class="account-form-card">
    <form method="post" novalidate>
        {% csrf_token %}

        {% include "_form_fields.html" with form=form %}

        <div class="account-form-actions">
            <a href="{% url 'sport_list' %}" class="account-back-button">キャンセル</a>
            <button type="submit" class="account-save-button">登録する</button>
        </div>
    </form>
</div>

<div class="admin-back-area">
    <a href="{% url 'sport_list' %}" class="admin-back-link">← 競技一覧に戻る</a>
</div>

{% endblock %}
