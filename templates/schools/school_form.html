{% extends "base.html" %}

{% block title %}学校情報の編集｜練習試合調整支援システム{% endblock %}

{% block heading %}学校情報管理{% endblock %}

{% block content %}

<div class="account-form-heading">
    <h2>学校情報の編集</h2>
    <p>「{{ object.name }}」の基本情報を編集します。</p>
</div>

<div class="account-form-card">
    <form method="post" novalidate>
        {% csrf_token %}

        {% include "_form_fields.html" with form=form %}

        <div class="account-form-actions">
            <a href="{% url 'school_list' %}" class="account-back-button">一覧に戻る</a>
            <button type="submit" class="account-save-button">保存する</button>
        </div>
    </form>
</div>

{% endblock %}
