{% extends "base.html" %}

{% block title %}学校アカウントの作成｜練習試合調整支援システム{% endblock %}

{% block heading %}学校アカウント管理{% endblock %}

{% block content %}

<div class="account-form-heading">
    <h2>学校アカウントの作成</h2>
    <p>学校の情報と、ログイン用の学校ID・パスワードを登録します。</p>
</div>

<div class="account-form-card">
    <form method="post" novalidate>
        {% csrf_token %}

        {% include "_form_fields.html" with form=form %}

        <div class="account-form-actions">
            <a href="{% url 'school_account_list' %}" class="account-back-button">一覧に戻る</a>
            <button type="submit" class="account-save-button">作成する</button>
        </div>
    </form>
</div>

{% endblock %}
